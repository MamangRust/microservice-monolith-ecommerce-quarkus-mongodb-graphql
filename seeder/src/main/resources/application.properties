# MongoDB — one named client per bounded context (see PGTOMONGDB.md §1.1).
quarkus.mongodb.uuid-representation=standard
quarkus.mongodb.devservices.enabled=false

# Default client: required because the domain modules pull in the Mongo Panache
# extension. Domain repositories are excluded from CDI, so it is only needed to
# satisfy the extension; seeders always resolve their own context via ctx.db().
quarkus.mongodb.connection-string=mongodb://${MONGO_IDENTITY_HOST:localhost}:${MONGO_IDENTITY_PORT:27017}
quarkus.mongodb.database=ec_identity

quarkus.mongodb."identity".connection-string=mongodb://${MONGO_IDENTITY_HOST:localhost}:${MONGO_IDENTITY_PORT:27017}
quarkus.mongodb."identity".database=ec_identity
quarkus.mongodb."merchant".connection-string=mongodb://${MONGO_MERCHANT_HOST:localhost}:${MONGO_MERCHANT_PORT:27017}
quarkus.mongodb."merchant".database=ec_merchant
quarkus.mongodb."catalog".connection-string=mongodb://${MONGO_CATALOG_HOST:localhost}:${MONGO_CATALOG_PORT:27017}
quarkus.mongodb."catalog".database=ec_catalog
quarkus.mongodb."sales".connection-string=mongodb://${MONGO_SALES_HOST:localhost}:${MONGO_SALES_PORT:27017}
quarkus.mongodb."sales".database=ec_sales
quarkus.mongodb."experience".connection-string=mongodb://${MONGO_EXPERIENCE_HOST:localhost}:${MONGO_EXPERIENCE_PORT:27017}
quarkus.mongodb."experience".database=ec_experience
quarkus.mongodb."email".connection-string=mongodb://${MONGO_EMAIL_HOST:localhost}:${MONGO_EMAIL_PORT:27017}
quarkus.mongodb."email".database=ec_email

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
