# Resilience for every @GrpcClient call made by the gateway. Applied by
# common's DependencyGuardInterceptor (@GlobalInterceptor): per full method
# name it adds a circuit breaker + bulkhead + per-call deadline. One breaker
# per downstream method, so a slow/failing service cannot exhaust the gateway
# or open the circuit for unrelated services. Values mirror the Go apigateway
# (pkg/resilience DependencyGuardInterceptor constants).
resilience.dependency-guard.failure-threshold=5
resilience.dependency-guard.open-timeout-seconds=30
resilience.dependency-guard.max-concurrent=100
resilience.dependency-guard.call-timeout=3s


quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Modular Monolith API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Gateway REST API backed by internal gRPC services


quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
