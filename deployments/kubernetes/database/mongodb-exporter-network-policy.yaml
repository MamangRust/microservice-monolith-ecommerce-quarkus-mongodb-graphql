# NetworkPolicy for the six mongodb-exporters: Prometheus scrapes them on :9216,
# and each exporter needs egress to its MongoDB instance (port 27017) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-exporter-netpol
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      tier: mongodb-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
      ports:
        - protocol: TCP
          port: 9216
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: mongo
      ports:
        - protocol: TCP
          port: 27017
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
