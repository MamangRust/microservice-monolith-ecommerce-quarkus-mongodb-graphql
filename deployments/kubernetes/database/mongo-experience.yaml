# MongoDB instance for the `experience` bounded context (database ec_experience).
# Consumers: banner, cart, review, review-detail, shipping-address, slider.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-experience
  namespace: ecommerce
spec:
  serviceName: mongo-experience
  replicas: 1
  selector:
    matchLabels:
      app: mongo-experience
  template:
    metadata:
      labels:
        app: mongo-experience
        tier: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          args: ["mongod", "--wiredTigerCacheSizeGB", "1"]
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-experience
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-experience
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-experience
  namespace: ecommerce
spec:
  # Headless: alamat stabil mongo-experience.ecommerce.svc.cluster.local untuk service
  # pemakai context ini. Hanya diakses dari dalam cluster (tanpa LoadBalancer).
  clusterIP: None
  selector:
    app: mongo-experience
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
