# NetworkPolicies for the six MongoDB instances. Each policy allows ingress on
# port 27017 ONLY from the pods of the services that own that bounded context
# (playbook §1.1) plus that context's mongodb-exporter. No egress rules: mongod
# only answers inbound connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-identity
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: mongo-identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth
        - podSelector:
            matchLabels:
              app: role
        - podSelector:
            matchLabels:
              app: user
        - podSelector:
            matchLabels:
              app: mongodb-exporter-identity
      ports:
        - protocol: TCP
          port: 27017
---
