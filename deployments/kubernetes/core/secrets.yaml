apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ecommerce-secrets
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  # MongoDB berjalan tanpa auth di dev/cluster ini, jadi tidak ada kredensial DB
  # di sini. Bila produksi mengaktifkan auth Mongo, tambahkan MONGO_USERNAME/
  # MONGO_PASSWORD di sini dan referensikan dari StatefulSet mongo-*.
  data:
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: ecommerce/GF_SECURITY_ADMIN_PASSWORD
    - secretKey: SECRET_KEY
      remoteRef:
        key: ecommerce/SECRET_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ecommerce/REDIS_PASSWORD
    - secretKey: SMTP_USER
      remoteRef:
        key: ecommerce/SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: ecommerce/SMTP_PASS
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: ecommerce/CLICKHOUSE_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ecommerce-secrets
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: ecommerce/GHCR_DOCKERCONFIGJSON
