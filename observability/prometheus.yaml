global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels:
          application: 'Prometheus'
          environment: 'production'

  - job_name: 'alertmanager'
    scrape_interval: 10s
    static_configs:
      - targets: [ 'alertmanager:9093' ]
        labels:
          application: 'Alertmanager'
          environment: 'production'

  - job_name: 'java-app-via-otel'
    static_configs:
      - targets: [ 'otel-collector:8889' ]
        labels:
          application: 'java-app'
          environment: 'production'

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: [ "node-exporter:9100" ]
        labels:
          application: "node-exporter"

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets:
          - 'mongodb-exporter-identity:9216'
          - 'mongodb-exporter-merchant:9216'
          - 'mongodb-exporter-catalog:9216'
          - 'mongodb-exporter-sales:9216'
          - 'mongodb-exporter-experience:9216'
          - 'mongodb-exporter-email:9216'
        labels:
          application: 'MongoDB'
          environment: 'production'

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]
        labels:
          application: 'Kafka'
          environment: 'production'
