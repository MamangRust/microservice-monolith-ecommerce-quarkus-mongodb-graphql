groups:
  - name: stats-pipeline-alerts
    rules:
      # --- Outbox lag (growing backlog) ---
      - alert: OutboxLagGrowing
        expr: |
          sum by (domain) (outbox_backlog) > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox lag growing for {{ $labels.domain }} ({{ $value }})"
          description: "Outbox backlog for domain {{ $labels.domain }} exceeds 5,000 pending events for 5 minutes."
          runbook: "Check OutboxPublisher scheduler in the domain service; verify Kafka connectivity."

      - alert: OutboxLagCritical
        expr: |
          sum by (domain) (outbox_backlog) > 50000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL outbox lag for {{ $labels.domain }} ({{ $value }})"
          description: "Outbox backlog for domain {{ $labels.domain }} exceeds 50,000 — events are severely delayed."

      # --- Stats writer flush errors ---
      - alert: StatsWriterFlushErrors
        expr: |
          increase(stats_writer_flush_errors_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Stats writer flush errors ({{ $value }} in 5m)"
          description: "stats-writer has more than 10 ClickHouse flush errors in 5 minutes."
          runbook: "Check ClickHouse connectivity and disk space; inspect stats-writer logs."

      - alert: StatsWriterFlushErrorsCritical
        expr: |
          increase(stats_writer_flush_errors_total[5m]) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL stats writer flush errors ({{ $value }} in 5m)"
          description: "stats-writer has more than 50 flush errors in 5 minutes — data loss risk."

      # --- Stats writer Kafka lag ---
      - alert: StatsWriterKafkaLagHigh
        expr: |
          stats_writer_kafka_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stats writer Kafka lag high ({{ $value }})"
          description: "stats-writer consumer lag exceeds 1,000 messages for 5 minutes."

      - alert: StatsWriterKafkaLagCritical
        expr: |
          stats_writer_kafka_lag > 10000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL stats writer Kafka lag ({{ $value }})"
          description: "stats-writer consumer lag exceeds 10,000 messages — stats data is stale."

      # --- Stats writer batch pending (stuck flush) ---
      - alert: StatsWriterBatchPendingHigh
        expr: |
          stats_writer_batch_pending > 5000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Stats writer batch pending high ({{ $value }})"
          description: "stats-writer has more than 5,000 rows buffered — flush may be stuck."

      # --- Stats reader cache ---
      - alert: StatsReaderCacheMissHigh
        expr: |
          rate(cache_outcome_total{service_name="stats-reader",result="miss"}[5m])
          / rate(cache_outcome_total{service_name="stats-reader"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Stats reader cache miss rate > 80%"
          description: "stats-reader cache miss rate is above 80% for 10 minutes — ClickHouse is under load."

      # --- Stats reader gRPC errors ---
      - alert: StatsReaderGrpcErrors
        expr: |
          increase(requests_total{service_name="stats-reader",status="ERROR"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Stats reader gRPC errors ({{ $value }} in 5m)"
          description: "stats-reader has more than 10 gRPC errors in 5 minutes."

      # --- Backfill health ---
      - alert: StatsBackfillNotRunning
        expr: |
          stats_writer_events_consumed_total == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No events consumed by stats-writer for 30 minutes"
          description: "stats-writer has not consumed any events for 30 minutes — check Kafka topics."
